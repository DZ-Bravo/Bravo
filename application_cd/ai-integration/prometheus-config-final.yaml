global:
  scrape_interval: 15s
  scrape_timeout: 10s
  scrape_protocols:
  - OpenMetricsText1.0.0
  - OpenMetricsText0.0.1
  - PrometheusText0.0.4
  evaluation_interval: 15s

scrape_configs:
  # Prometheus 자체 메트릭
  - job_name: prometheus
    honor_timestamps: true
    track_timestamps_staleness: false
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - localhost:9090

  # Node Exporter 메트릭
  - job_name: node-exporter
    honor_timestamps: true
    track_timestamps_staleness: false
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - localhost:9100

  # Kubernetes API Server를 통한 cAdvisor 메트릭 - 노드 1
  # 이 방법은 Kubernetes API 서버를 통해 노드 메트릭에 접근합니다
  # EC2에서 실행 중인 경우, kubeconfig 파일이 있으면 자동 인증됩니다
  - job_name: kubernetes-cadvisor-node1
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets:
          - CD954D03FD7521324954E667CB2450E9.yl4.ap-northeast-2.eks.amazonaws.com:443
    metrics_path: /api/v1/nodes/ip-10-0-17-71.ap-northeast-2.compute.internal/proxy/metrics/cadvisor
    # kubeconfig 파일이 있으면 자동 인증
    # 없으면 bearer_token_file 사용: bearer_token_file: /path/to/token
    relabel_configs:
      - target_label: instance
        replacement: 'ip-10-0-17-71.ap-northeast-2.compute.internal'
      - target_label: node
        replacement: 'ip-10-0-17-71.ap-northeast-2.compute.internal'

  # Kubernetes API Server를 통한 cAdvisor 메트릭 - 노드 2
  - job_name: kubernetes-cadvisor-node2
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets:
          - CD954D03FD7521324954E667CB2450E9.yl4.ap-northeast-2.eks.amazonaws.com:443
    metrics_path: /api/v1/nodes/ip-10-0-24-98.ap-northeast-2.compute.internal/proxy/metrics/cadvisor
    relabel_configs:
      - target_label: instance
        replacement: 'ip-10-0-24-98.ap-northeast-2.compute.internal'
      - target_label: node
        replacement: 'ip-10-0-24-98.ap-northeast-2.compute.internal'

  # 애플리케이션 서비스 메트릭 (Kubernetes Pods에서 /metrics 엔드포인트 스크랩)
  - job_name: kubernetes-pods-app-metrics
    kubernetes_sd_configs:
      - role: pod
        api_server: https://CD954D03FD7521324954E667CB2450E9.yl4.ap-northeast-2.eks.amazonaws.com
        tls_config:
          insecure_skip_verify: true
    relabel_configs:
      # prometheus.io/scrape=true annotation이 있는 Pod만 선택
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      # metrics 경로 설정
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: ""
        replacement: /metrics
      # 포트 설정
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      # 라벨 추가
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: replace
        target_label: app
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: replace
        target_label: service
        regex: (.+)-service
        replacement: ${1}

