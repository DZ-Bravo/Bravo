apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-infra-service-role
  namespace: bravo-ai-integration-ns
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "pods/log", "services", "namespaces", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes/metrics", "nodes/stats"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-infra-service-rolebinding
  namespace: bravo-ai-integration-ns
subjects:
- kind: ServiceAccount
  name: ai-integration-service
  namespace: bravo-ai-integration-ns
roleRef:
  kind: Role
  name: ai-infra-service-role
  apiGroup: rbac.authorization.k8s.io
---
# ClusterRole for nodes (nodes are cluster-scoped)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-infra-service-cluster-role
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/metrics", "nodes/stats"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces", "events", "pods", "pods/log", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-infra-service-cluster-rolebinding
subjects:
- kind: ServiceAccount
  name: ai-integration-service
  namespace: bravo-ai-integration-ns
roleRef:
  kind: ClusterRole
  name: ai-infra-service-cluster-role
  apiGroup: rbac.authorization.k8s.io

