apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: core-role
  namespace: bravo-core-ns
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]

- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get"]

- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]

