apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-service-ca-test
  namespace: bravo-core-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: community-service-ca-test
  template:
    metadata:
      labels:
        app: community-service-ca-test
    spec:
      containers:
      - name: community-service
        image: 940482451773.dkr.ecr.ap-northeast-2.amazonaws.com/bravo/hiking-community:latest
        ports:
        - containerPort: 3002
          name: http
        env:
        - name: TZ
          valueFrom:
            configMapKeyRef:
              name: bravo-config
              key: TZ
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: bravo-config
              key: NODE_ENV
        - name: PORT
          value: "3002"
        - name: MONGODB_URI
          value: "mongodb://mongodb.bravo-mongo-ns.svc.cluster.local:27017/hiking"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET
        - name: ELASTICSEARCH_URL
          value: "http://elasticsearch.bravo-efk-ns.svc.cluster.local:9200"
        resources:
          requests:
            cpu: "1500m"
            memory: "1Gi"
          limits:
            cpu: "1500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: community-uploads-pvc

