apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-autoscaler
  template:
    metadata:
      labels:
        app: cluster-autoscaler
    spec:
      serviceAccountName: cluster-autoscaler
      containers:
      - name: cluster-autoscaler
        image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.34.1
        command:
          - ./cluster-autoscaler
          - --cloud-provider=aws
          - --cluster-name=bravo-eks
          - --node-group-auto-discovery=asg:tag=k8s.io/cluster-autoscaler/enabled,k8s.io/cluster-autoscaler/bravo-eks
          - --balance-similar-node-groups
          - --skip-nodes-with-local-storage=false
          - --stderrthreshold=info
          - --v=4
        resources:
          requests:
            cpu: 100m
            memory: 300Mi
