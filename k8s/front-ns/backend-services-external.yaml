# =================================================
# ExternalName Services for Backend APIs
# =================================================
# ALB Ingress는 같은 네임스페이스의 서비스만 참조할 수 있으므로,
# frontend 네임스페이스에 ExternalName Service를 생성하여
# 다른 네임스페이스의 백엔드 서비스를 참조합니다.

apiVersion: v1
kind: Service
metadata:
  name: store-service
  namespace: bravo-front-ns
spec:
  type: ExternalName
  externalName: store-service.bravo-core-ns.svc.cluster.local
  ports:
  - port: 3006
    targetPort: 3006
---
