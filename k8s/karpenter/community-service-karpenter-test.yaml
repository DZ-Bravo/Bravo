apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-service-karpenter-test
  namespace: bravo-core-ns
spec:
  replicas: 1   # 시작은 1, 테스트 시 scale로 늘릴 것
  selector:
    matchLabels:
      app: community-service-karpenter-test
  template:
    metadata:
      labels:
        app: community-service-karpenter-test
    spec:
      containers:
      - name: community-service
        image: 940482451773.dkr.ecr.ap-northeast-2.amazonaws.com/bravo/hiking-community-service:2.135
        ports:
        - containerPort: 3002

        # 🔥 Karpenter 테스트 핵심 설정 (CA 테스트와 동일)
        resources:
          requests:
            cpu: "1500m"     # ★ 매우 중요 (노드 하나에 2개도 버거움)
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "1.5Gi"

        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10

