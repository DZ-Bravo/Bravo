apiVersion: apps/v1
kind: Deployment
metadata:
  name: monstache
  namespace: hiking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monstache
  template:
    metadata:
      labels:
        app: monstache
    spec:
      containers:
      - name: monstache
        image: rwynn/monstache:latest
        env:
        - name: TZ
          value: "Asia/Seoul"
        volumeMounts:
        - name: monstache-config
          mountPath: /config.toml
          subPath: config.toml
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: monstache-config
        configMap:
          name: monstache-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monstache-config
  namespace: hiking
data:
  config.toml: |
    mongo-url = "mongodb://admin:admin123@mongodb-0.mongodb:27017,mongodb-1.mongodb:27017,mongodb-2.mongodb:27017/hiking?authSource=admin&replicaSet=rs0&readPreference=primaryPreferred"
    mongo-direct = false
    elasticsearch-urls = ["http://elasticsearch:9200"]
    
    [[mapping]]
    namespace = "hiking.Mountain_list"
    index = "mountains"
    
    [[mapping]]
    namespace = "hiking.posts"
    index = "posts"
    
    [[mapping]]
    namespace = "hiking.shoes"
    index = "products"
    
    [[mapping]]
    namespace = "hiking.top"
    index = "products"
    
    [[mapping]]
    namespace = "hiking.bottom"
    index = "products"
    
    [[mapping]]
    namespace = "hiking.goods"
    index = "products"

