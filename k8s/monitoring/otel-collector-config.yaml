apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: bravo-monitoring-ns
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
    exporters:
      otlphttp/tempo:
        endpoint: http://tempo.bravo-monitoring-ns:4318
        tls:
          insecure: true
      debug:
        verbosity: normal
    extensions:
      health_check:
      pprof:
        endpoint: 0.0.0.0:1777
      zpages:
        endpoint: 0.0.0.0:55679
    service:
      extensions: [health_check, pprof, zpages]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/tempo, debug]
