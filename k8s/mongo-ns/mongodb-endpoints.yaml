# =================================================
# MongoDB Endpoints for EC2 MongoDB Instances
# =================================================
# 이 Endpoints 리소스는 EC2에 있는 MongoDB 인스턴스들을
# Kubernetes Service로 연결합니다.
#
# EC2 MongoDB 구조:
# - Primary: 10.0.11.92 (bravo-mongodb-primary)
# - Secondary1: 10.0.9.41 (bravo-mongodb-secondary1)
# - Secondary2: 10.0.15.147 (bravo-mongodb-secondary-2)

apiVersion: v1
kind: Endpoints
metadata:
  name: mongodb
  namespace: bravo-mongo-ns
  labels:
    app: mongodb
subsets:
- addresses:
  - ip: 10.0.11.82   # MongoDB Primary (bravo-mongodb-primary) - 실제 IP
  - ip: 10.0.9.41    # MongoDB Secondary1 (bravo-mongodb-secondary1)
  - ip: 10.0.15.147  # MongoDB Secondary2 (bravo-mongodb-secondary-2)
  ports:
  - port: 27017
    name: mongodb
    protocol: TCP

