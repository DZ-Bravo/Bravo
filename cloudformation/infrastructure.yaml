AWSTemplateFormatVersion: '2010-09-09'
Description: 'Hiking Cloud Infrastructure - VPC, EC2, EKS with NAT Gateway'

Parameters:
  KeyPairName:
    Type: String
    Description: Name of an existing EC2 KeyPair for SSH access (optional, leave empty if using Session Manager)
    Default: ''
    
  InstanceTypeMonitoring:
    Type: String
    Default: t3.large
    Description: Instance type for Monitoring EC2 (Prometheus/Grafana)
    
  InstanceTypeGitLab:
    Type: String
    Default: t3.xlarge
    Description: Instance type for GitLab
    
  InstanceTypeMongoDB:
    Type: String
    Default: t3.large
    Description: Instance type for MongoDB Primary
    
  InstanceTypeMongoDBSecondary:
    Type: String
    Default: t3.medium
    Description: Instance type for MongoDB Secondary
    
  InstanceTypeElasticsearchRedisMonstacheKibana:
    Type: String
    Default: t3.xlarge
    Description: Instance type for Elasticsearch + Redis + Monstache + Kibana (통합 노드)
    

Mappings:
  RegionMap:
    ap-northeast-2:
      UbuntuAMI: ami-0c9c942bd7bf113a2  # Ubuntu 22.04 LTS

Resources:
  # ============================================
  # VPC
  # ============================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: bravo-vpc

  # ============================================
  # Internet Gateway
  # ============================================
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: bravo-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  # ============================================
  # Subnets
  # ============================================
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: bravo-public-a
        - Key: Type
          Value: public
        - Key: kubernetes.io/cluster/bravo-eks
          Value: shared
        - Key: kubernetes.io/role/elb
          Value: "1"

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: bravo-public-b
        - Key: Type
          Value: public
        - Key: kubernetes.io/cluster/bravo-eks
          Value: shared
        - Key: kubernetes.io/role/elb
          Value: "1"

  PrivateEKSSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.20.0/21
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: bravo-private-eks-a
        - Key: Type
          Value: private-eks
        - Key: kubernetes.io/cluster/bravo-eks
          Value: shared
        - Key: kubernetes.io/role/internal-elb
          Value: "1"

  PrivateEKSSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.28.0/21
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: bravo-private-eks-b
        - Key: Type
          Value: private-eks
        - Key: kubernetes.io/cluster/bravo-eks
          Value: shared
        - Key: kubernetes.io/role/internal-elb
          Value: "1"

  PrivateSvcSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.8.0/22
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: bravo-private-svc-a
        - Key: Type
          Value: private-svc

  PrivateSvcSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.12.0/22
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: bravo-private-svc-b
        - Key: Type
          Value: private-svc

  # ============================================
  # Route Tables
  # ============================================
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: bravo-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: bravo-private-rt

  PrivateSubnetEKSARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateEKSSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetEKSBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateEKSSubnetB
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetSvcARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSvcSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetSvcBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSvcSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # ============================================
  # Security Groups
  # ============================================
  MonitoringSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: bravo-monitoring-sg
      GroupDescription: Security group for Monitoring EC2 (Prometheus/Grafana)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 0.0.0.0/0
          Description: Grafana
        - IpProtocol: tcp
          FromPort: 9090
          ToPort: 9090
          CidrIp: 10.0.0.0/16
          Description: Prometheus from VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: bravo-monitoring-sg

  GitLabSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: bravo-gitlab-sg
      GroupDescription: Security group for GitLab EC2
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: bravo-gitlab-sg

  MongoDBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: bravo-mongodb-sg
      GroupDescription: Security group for MongoDB EC2
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.0.0.0/16
          Description: SSH from VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: bravo-mongodb-sg

  # MongoDB Replica Set 통신 규칙 (Primary ↔ Secondary 간 통신)
  MongoDBSecurityGroupIngressReplicaSet:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn: MongoDBSecurityGroup
    Properties:
      GroupId: !Ref MongoDBSecurityGroup
      IpProtocol: tcp
      FromPort: 27017
      ToPort: 27017
      SourceSecurityGroupId: !Ref MongoDBSecurityGroup
      Description: MongoDB Replica Set communication (self-referencing)

  # Monstache → MongoDB 통신 규칙 (ElasticsearchRedisMonstacheKibana → MongoDB)
  MongoDBSecurityGroupIngressFromElasticsearch:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn:
      - MongoDBSecurityGroup
      - ElasticsearchRedisMonstacheKibanaSecurityGroup
    Properties:
      GroupId: !Ref MongoDBSecurityGroup
      IpProtocol: tcp
      FromPort: 27017
      ToPort: 27017
      SourceSecurityGroupId: !Ref ElasticsearchRedisMonstacheKibanaSecurityGroup
      Description: MongoDB access from Elasticsearch/Redis/Monstache/Kibana instance (Monstache)

  # Elasticsearch/Redis/Monstache/Kibana Security Group
  ElasticsearchRedisMonstacheKibanaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: bravo-elasticsearch-redis-monstache-kibana-sg
      GroupDescription: Security group for Elasticsearch + Redis + Monstache + Kibana EC2
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 9200
          ToPort: 9200
          CidrIp: 10.0.0.0/16
          Description: Elasticsearch from VPC
        - IpProtocol: tcp
          FromPort: 5601
          ToPort: 5601
          CidrIp: 10.0.0.0/16
          Description: Kibana from VPC
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          CidrIp: 10.0.0.0/16
          Description: Redis from VPC
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.0.0.0/16
          Description: SSH from VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: bravo-elasticsearch-redis-monstache-kibana-sg

  # MongoDB Security Group 규칙 (EKS에서 접근)
  # NOTE: EKS를 직접 생성한 후, EKS 노드의 Security Group을 여기에 추가해야 합니다
  # 예: aws ec2 authorize-security-group-ingress --group-id <MongoDBSecurityGroupId> \
  #     --protocol tcp --port 27017 --source-group <EKSNodeSecurityGroupId>

  EKSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: bravo-eks-sg
      GroupDescription: Security group for EKS and services
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/16
          Description: Allow HTTPS from VPC
        - IpProtocol: tcp
          FromPort: 1025
          ToPort: 65535
          CidrIp: 10.0.0.0/16
          Description: Allow ephemeral ports from VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: bravo-eks-sg

  # NOTE: EKS 클러스터 Security Group 규칙은 EKS를 직접 생성한 후 수동으로 추가해야 합니다
  # EKS 클러스터 생성 시 자동 생성되는 Cluster Security Group에 다음 규칙 추가:
  # - VPC CIDR (10.0.0.0/16)에서 443 포트 허용
  # - EKSSecurityGroup에서 443 포트 허용

  # ============================================
  # Elastic IPs
  # ============================================
  NATGatewayElasticIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: bravo-nat-gateway-eip

  GitLabElasticIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: bravo-gitlab-eip

  # ============================================
  # NAT Gateway
  # ============================================
  NATGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: NATGatewayElasticIP
    Properties:
      AllocationId: !GetAtt NATGatewayElasticIP.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: bravo-nat-gateway

  PrivateNATRoute:
    Type: AWS::EC2::Route
    DependsOn: NATGateway
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway

  # ============================================
  # EC2 Instance Profile for Session Manager (GitLab, MongoDB 등)
  # ============================================
  EC2InstanceProfileRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bravo-ec2-ssm-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: bravo-ec2-ssm-role

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: bravo-ec2-ssm-profile
      Roles:
        - !Ref EC2InstanceProfileRole

  # ============================================
  # Monitoring EC2 (Prometheus + Grafana)
  # ============================================
  MonitoringInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !FindInMap [RegionMap, !Ref 'AWS::Region', UbuntuAMI]
      InstanceType: !Ref InstanceTypeMonitoring
      IamInstanceProfile: !Ref EC2InstanceProfile
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref 'AWS::NoValue']
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds:
        - !Ref MonitoringSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 50
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          
          # Update system
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get upgrade -y
          
          # Install SSM Agent
          snap install amazon-ssm-agent --classic
          snap start amazon-ssm-agent
          systemctl enable snap.amazon-ssm-agent.amazon-ssm-agent.service
          
          # Log SSM Agent status
          echo "$(date): SSM Agent installed and started" >> /var/log/ssm-setup.log
      Tags:
        - Key: Name
          Value: bravo-monitoring
        - Key: Role
          Value: monitoring

  MonitoringElasticIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: bravo-monitoring-eip

  MonitoringEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    DependsOn: MonitoringInstance
    Properties:
      InstanceId: !Ref MonitoringInstance
      AllocationId: !GetAtt MonitoringElasticIP.AllocationId

  # ============================================
  # GitLab EC2
  # ============================================
  GitLabInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !FindInMap [RegionMap, !Ref 'AWS::Region', UbuntuAMI]
      InstanceType: !Ref InstanceTypeGitLab
      IamInstanceProfile: !Ref EC2InstanceProfile
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref 'AWS::NoValue']
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds:
        - !Ref GitLabSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 50
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          
          # Update system
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get upgrade -y
          
          # Install SSM Agent
          snap install amazon-ssm-agent --classic
          snap start amazon-ssm-agent
          systemctl enable snap.amazon-ssm-agent.amazon-ssm-agent.service
          
          # Log SSM Agent status
          echo "$(date): SSM Agent installed and started" >> /var/log/ssm-setup.log
      Tags:
        - Key: Name
          Value: bravo-gitlab
        - Key: Role
          Value: gitlab

  GitLabEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    DependsOn: GitLabInstance
    Properties:
      InstanceId: !Ref GitLabInstance
      AllocationId: !GetAtt GitLabElasticIP.AllocationId

  # ============================================
  # MongoDB EC2
  # ============================================
  # MongoDB Primary
  MongoDBPrimaryInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !FindInMap [RegionMap, !Ref 'AWS::Region', UbuntuAMI]
      InstanceType: !Ref InstanceTypeMongoDB
      IamInstanceProfile: !Ref EC2InstanceProfile
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref 'AWS::NoValue']
      SubnetId: !Ref PrivateSvcSubnetA
      SecurityGroupIds:
        - !Ref MongoDBSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 50
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          
          # Update system
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get upgrade -y
          
          # Install SSM Agent
          snap install amazon-ssm-agent --classic
          snap start amazon-ssm-agent
          systemctl enable snap.amazon-ssm-agent.amazon-ssm-agent.service
          
          # Log SSM Agent status
          echo "$(date): SSM Agent installed and started" >> /var/log/ssm-setup.log
      Tags:
        - Key: Name
          Value: bravo-mongodb-primary
        - Key: Role
          Value: mongodb-primary

  # MongoDB Secondary 1
  MongoDBSecondary1Instance:
    Type: AWS::EC2::Instance
    DependsOn: MongoDBSecurityGroup
    Properties:
      ImageId: !FindInMap [RegionMap, !Ref 'AWS::Region', UbuntuAMI]
      InstanceType: !Ref InstanceTypeMongoDBSecondary
      IamInstanceProfile: !Ref EC2InstanceProfile
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref 'AWS::NoValue']
      SubnetId: !Ref PrivateSvcSubnetA
      SecurityGroupIds:
        - !Ref MongoDBSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 50
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          
          # Update system
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get upgrade -y
          
          # Install SSM Agent
          snap install amazon-ssm-agent --classic
          snap start amazon-ssm-agent
          systemctl enable snap.amazon-ssm-agent.amazon-ssm-agent.service
          
          # Log SSM Agent status
          echo "$(date): SSM Agent installed and started" >> /var/log/ssm-setup.log
      Tags:
        - Key: Name
          Value: bravo-mongodb-secondary-1
        - Key: Role
          Value: mongodb-secondary

  # MongoDB Secondary 2
  MongoDBSecondary2Instance:
    Type: AWS::EC2::Instance
    DependsOn: MongoDBSecurityGroup
    Properties:
      ImageId: !FindInMap [RegionMap, !Ref 'AWS::Region', UbuntuAMI]
      InstanceType: !Ref InstanceTypeMongoDBSecondary
      IamInstanceProfile: !Ref EC2InstanceProfile
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref 'AWS::NoValue']
      SubnetId: !Ref PrivateSvcSubnetB
      SecurityGroupIds:
        - !Ref MongoDBSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 50
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          
          # Update system
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get upgrade -y
          
          # Install SSM Agent
          snap install amazon-ssm-agent --classic
          snap start amazon-ssm-agent
          systemctl enable snap.amazon-ssm-agent.amazon-ssm-agent.service
          
          # Log SSM Agent status
          echo "$(date): SSM Agent installed and started" >> /var/log/ssm-setup.log
      Tags:
        - Key: Name
          Value: bravo-mongodb-secondary-2
        - Key: Role
          Value: mongodb-secondary

  # ============================================
  # Elasticsearch + Redis + Monstache + Kibana EC2 (통합 노드)
  # ============================================
  ElasticsearchRedisMonstacheKibanaInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !FindInMap [RegionMap, !Ref 'AWS::Region', UbuntuAMI]
      InstanceType: !Ref InstanceTypeElasticsearchRedisMonstacheKibana
      IamInstanceProfile: !Ref EC2InstanceProfile
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref 'AWS::NoValue']
      SubnetId: !Ref PrivateSvcSubnetB
      SecurityGroupIds:
        - !Ref ElasticsearchRedisMonstacheKibanaSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 100
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          
          # Update system
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get upgrade -y
          
          # Install SSM Agent
          snap install amazon-ssm-agent --classic
          snap start amazon-ssm-agent
          systemctl enable snap.amazon-ssm-agent.amazon-ssm-agent.service
          
          # Log SSM Agent status
          echo "$(date): SSM Agent installed and started" >> /var/log/ssm-setup.log
      Tags:
        - Key: Name
          Value: bravo-elasticsearch-redis-monstache-kibana
        - Key: Role
          Value: elasticsearch-redis-monstache-kibana

  # ============================================
  # EKS Cluster (직접 AWS에서 생성)
  # ============================================
  # NOTE: EKS 클러스터는 AWS Console 또는 CLI로 직접 생성하세요
  # 
  # 생성 시 필요한 정보:
  # - VPC: !Ref VPC
  # - Subnets: PrivateEKSSubnetA, PrivateEKSSubnetB
  # - Security Group: EKSSecurityGroup
  # - Cluster Role: IAM Role with AmazonEKSClusterPolicy
  # - Node Role: IAM Role with AmazonEKSWorkerNodePolicy, AmazonEKS_CNI_Policy 등
  #
  # 생성 명령어 예시:
  # aws eks create-cluster \
  #   --name bravo-eks \
  #   --role-arn <CLUSTER_ROLE_ARN> \
  #   --resources-vpc-config subnetIds=<SUBNET_IDS>,securityGroupIds=<SG_ID> \
  #   --endpoint-config privateAccess=true,publicAccess=false

Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, '']]

Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub '${AWS::StackName}-VPCId'

  PublicSubnetAId:
    Description: Public Subnet A ID
    Value: !Ref PublicSubnetA
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnetAId'

  PublicSubnetBId:
    Description: Public Subnet B ID
    Value: !Ref PublicSubnetB
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnetBId'

  PrivateEKSSubnetAId:
    Description: Private EKS Subnet A ID
    Value: !Ref PrivateEKSSubnetA
    Export:
      Name: !Sub '${AWS::StackName}-PrivateEKSSubnetAId'

  PrivateEKSSubnetBId:
    Description: Private EKS Subnet B ID
    Value: !Ref PrivateEKSSubnetB
    Export:
      Name: !Sub '${AWS::StackName}-PrivateEKSSubnetBId'

  PrivateSvcSubnetAId:
