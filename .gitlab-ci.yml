    - when: never
.rule_mountain_manual:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: ["services/backend-services/mountain-service/**/*"]
      when: manual
    - when: never

.rule_notice_auto:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: ["services/backend-services/notice-service/**/*"]
      when: always
    - when: never
.rule_notice_manual:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: ["services/backend-services/notice-service/**/*"]
      when: manual
    - when: never

.rule_notification_auto:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: ["services/backend-services/notification-service/**/*"]
      when: always
    - when: never
.rule_notification_manual:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: ["services/backend-services/notification-service/**/*"]
