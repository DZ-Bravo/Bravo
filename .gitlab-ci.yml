# ===============================
# Frontend Jobs
# ===============================
sonar-frontend:
  stage: analyze
  extends: .frontend_rules_auto
  allow_failure: false
  needs: []
  image: sonarsource/sonar-scanner-cli:5
  script:
    - |
      sonar-scanner \
        -Dsonar.projectKey=frontend \
        -Dsonar.sources=services/frontend-service \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.qualitygate.wait=true
  <<: *notify_slack_failure

build-frontend:
  stage: build
  extends: .frontend_rules_auto
  allow_failure: false
  variables:
    ECR_REPO: "bravo/hiking-frontend"
  script:
    - *before_build
    - source version.env
    - |
      docker build \
        -f services/frontend-service/Dockerfile \
        -t "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${NEXT_VERSION}" \
        services/frontend-service
    - docker push "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${NEXT_VERSION}"
  artifacts:
    reports:
      dotenv: version.env
  <<: *notify_build_success

deploy-frontend:
  stage: deploy
  extends: .frontend_rules_manual
  allow_failure: false
  variables:
    ECR_REPO: "bravo/hiking-frontend"
    K8S_NS: "bravo-front-ns"
    DEPLOY_NAME: "frontend"
  environment:
    name: production/frontend
    url: https://hiker-cloud.site
  image:
    name: amazon/aws-cli:2.15.0
    entrypoint: [""]
  needs:
    - job: build-frontend
      artifacts: true
    - job: sonar-frontend
    - job: secret_detection
    - job: semgrep-sast
  script:
    - echo "Deploying version $NEXT_VERSION"
    - curl -LO https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/kubectl
    - aws eks update-kubeconfig --region ap- northeast-2 --name bravo-eks
    - |
      CONTAINER_NAME=$(kubectl get deploy ${DEPLOY_NAME} -n ${K8S_NS} -o jsonpath='{.spec.template.spec.containers[0].name}')
      kubectl set image deployment/frontend \
        frontend=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${NEXT_VERSION} \
        -n bravo-front-ns
    - kubectl rollout status deployment/frontend -n bravo-front-ns
  <<: *notify_slack_failure

# ===============================
# Backend (Multiple Services)
# ===============================
sonar-backend:
  stage: analyze
  extends: .backend_rules_auto
  image: sonarsource/sonar-scanner-cli:5
  allow_failure: false
  parallel:
    matrix:
      - SERVICE_NAME: [auth-service, chatbot-service, community-service, mountain-service, notice-service, notification-service, schedule-service, stamp-service, store-service]
  script:
    - |
      sonar-scanner \
        -Dsonar.projectKey=${SERVICE_NAME} \
        -Dsonar.sources=services/backend-services/${SERVICE_NAME} \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.qualitygate.wait=true 
  <<: *notify_slack_failure

.build-backend:
  stage: build
  allow_failure: false
  image: docker:27
  services:
    - docker:27-dind
  script:
    - export IMAGE_TAG="2.${CI_PIPELINE_IID}"
    - rm -rf backend-services shared && mkdir -p backend-services
    - cp -r services/backend-services/${SERVICE_NAME} backend-services/${SERVICE_NAME}
    - if [ -d services/shared ]; then cp -r services/shared ./shared; else mkdir -p shared; fi
    - apk add --no-cache curl aws-cli
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
    - |
      docker build \
        -f services/backend-services/${SERVICE_NAME}/Dockerfile \
        -t "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}" \
        .
    - docker push "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}"
  <<: *notify_build_success

build-auth:
  extends: [.build-backend, .rule_auth_auto]
  variables: { SERVICE_NAME: "auth-service", ECR_REPO: "$AUTH_ECR_REPO" }
build-chatbot:
  extends: [.build-backend, .rule_chatbot_auto]
  variables: { SERVICE_NAME: "chatbot-service", ECR_REPO: "$CHATBOT_ECR_REPO" }
build-community:
  extends: [.build-backend, .rule_community_auto]
  variables: { SERVICE_NAME: "community-service", ECR_REPO: "$COMMUNITY_ECR_REPO" }
build-mountain:
  extends: [.build-backend, .rule_mountain_auto]
  variables: { SERVICE_NAME: "mountain-service", ECR_REPO: "$MOUNTAIN_ECR_REPO" }
build-notice:
  extends: [.build-backend, .rule_notice_auto]
  variables: { SERVICE_NAME: "notice-service", ECR_REPO: "$NOTICE_ECR_REPO" }
build-notification:
  extends: [.build-backend, .rule_notification_auto]
  variables: { SERVICE_NAME: "notification-service", ECR_REPO: "$NOTIFICATION_ECR_REPO" }
build-schedule:
  extends: [.build-backend, .rule_schedule_auto]
  variables: { SERVICE_NAME: "schedule-service", ECR_REPO: "$SCHEDULE_ECR_REPO" }
build-stamp:
  extends: [.build-backend, .rule_stamp_auto]
  variables: { SERVICE_NAME: "stamp-service", ECR_REPO: "$STAMP_ECR_REPO" }
build-store:
  extends: [.build-backend, .rule_store_auto]
  variables: { SERVICE_NAME: "store-service", ECR_REPO: "$STORE_ECR_REPO" }

.deploy-backend:
  stage: deploy
  allow_failure: false
  image:
    name: amazon/aws-cli:2.15.0
    entrypoint: [""]
  script:
    - export IMAGE_TAG="2.${CI_PIPELINE_IID}"
    - curl -LO https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl && chmod +x kubectl && mv kubectl /usr/local/bin/kubectl
    - aws eks update-kubeconfig --region ap-northeast-2 --name bravo-eks
    - |
      CONTAINER_NAME=$(kubectl get deploy ${SERVICE_NAME} -n ${K8S_NS} -o jsonpath='{.spec.template.spec.containers[0].name}')
      kubectl set image deployment/${SERVICE_NAME} ${CONTAINER_NAME}=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG} -n ${K8S_NS}
    - kubectl rollout status deployment/${SERVICE_NAME} -n ${K8S_NS} --timeout=5m
  <<: *notify_slack_failure

deploy-auth:
  extends: [.deploy-backend, .rule_auth_manual]
  variables: { SERVICE_NAME: "auth-service", ECR_REPO: "$AUTH_ECR_REPO", K8S_NS: "bravo-core-ns" }
  needs: ["build-auth", "sonar-backend", "secret_detection", "semgrep-sast"]
deploy-chatbot:
  extends: [.deploy-backend, .rule_chatbot_manual]
  variables: { SERVICE_NAME: "chatbot-service", ECR_REPO: "$CHATBOT_ECR_REPO", K8S_NS: "bravo-ai-integration-ns" }
  needs: ["build-chatbot", "sonar-backend", "secret_detection", "semgrep-sast"]
deploy-community:
  extends: [.deploy-backend, .rule_community_manual]
  variables: { SERVICE_NAME: "community-service", ECR_REPO: "$COMMUNITY_ECR_REPO", K8S_NS: "bravo-core-ns" }
  needs: ["build-community", "sonar-backend", "secret_detection", "semgrep-sast"]
deploy-mountain:
  extends: [.deploy-backend, .rule_mountain_manual]
  variables: { SERVICE_NAME: "mountain-service", ECR_REPO: "$MOUNTAIN_ECR_REPO", K8S_NS: "bravo-core-ns" }
  needs: ["build-mountain", "sonar-backend", "secret_detection", "semgrep-sast"]
deploy-notice:
  extends: [.deploy-backend, .rule_notice_manual]
  variables: { SERVICE_NAME: "notice-service", ECR_REPO: "$NOTICE_ECR_REPO", K8S_NS: "bravo-core-ns" }
  needs: ["build-notice", "sonar-backend", "secret_detection", "semgrep-sast"]
deploy-notification:
  extends: [.deploy-backend, .rule_notification_manual]
  variables: { SERVICE_NAME: "notification-service", ECR_REPO: "$NOTIFICATION_ECR_REPO", K8S_NS: "bravo-core-ns" }
  needs: ["build-notification", "sonar-backend", "secret_detection", "semgrep-sast"]
deploy-schedule:
  extends: [.deploy-backend, .rule_schedule_manual]
  variables: { SERVICE_NAME: "schedule-service", ECR_REPO: "$SCHEDULE_ECR_REPO", K8S_NS: "bravo-core-ns" }
  needs: ["build-schedule", "sonar-backend", "secret_detection", "semgrep-sast"]
deploy-stamp:
  extends: [.deploy-backend, .rule_stamp_manual]
  variables: { SERVICE_NAME: "stamp-service", ECR_REPO: "$STAMP_ECR_REPO", K8S_NS: "bravo-core-ns" }
  needs: ["build-stamp", "sonar-backend", "secret_detection", "semgrep-sast"]
deploy-store:
  extends: [.deploy-backend, .rule_store_manual]
  variables: { SERVICE_NAME: "store-service", ECR_REPO: "$STORE_ECR_REPO", K8S_NS: "bravo-core-ns" }
  needs: ["build-store", "sonar-backend", "secret_detection", "semgrep-sast"]

# ===============================
# AI Infra Service
# ===============================
sonar-ai-infra:
  stage: analyze
  extends: .ai_infra_rules_auto
  allow_failure: false
  image: sonarsource/sonar-scanner-cli:5
  script:
    - |
      sonar-scanner \
        -Dsonar.projectKey=ai-infra-service \
        -Dsonar.sources=services/backend-services/ai-infra-service \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.qualitygate.wait=true
  <<: *notify_slack_failure

build-ai-infra:
  stage: build
  extends: .ai_infra_rules_auto
  allow_failure: false
  variables:
    ECR_REPO: "$AI_ECR_REPO"
  script:
    - export IMAGE_TAG="2.${CI_PIPELINE_IID}"
    - apk add --no-cache curl aws-cli
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
    - |
      docker build \
        -f services/backend-services/ai-infra-service/backend/Dockerfile \
        -t "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}" \
        services/backend-services/ai-infra-service/backend
    - docker push "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}"
  <<: *notify_slack_failure

deploy-ai-infra:
  stage: deploy
  extends: .ai_infra_rules_manual
  allow_failure: false
  image:
    name: amazon/aws-cli:2.15.0
    entrypoint: [""]
  variables:
    DEPLOYMENT_NAME: "ai-service"
    K8S_NS: "bravo-ai-integration-ns"
    ECR_REPO: "$AI_ECR_REPO"
  needs:
    - job: build-ai-infra
    - job: sonar-ai-infra
    - job: secret_detection
    - job: semgrep-sast
  script:
    - export IMAGE_TAG="2.${CI_PIPELINE_IID}"
    - curl -LO https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl && chmod +x kubectl && mv kubectl /usr/local/bin/kubectl
    - aws eks update-kubeconfig --region ap-northeast-2 --name bravo-eks
    - |
      CONTAINER_NAME=$(kubectl get deploy ${DEPLOYMENT_NAME} -n ${K8S_NS} -o jsonpath='{.spec.template.spec.containers[0].name}')
      kubectl set image deployment/${DEPLOYMENT_NAME} ${CONTAINER_NAME}=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG} -n ${K8S_NS}
    - kubectl rollout status deployment/${DEPLOYMENT_NAME} -n ${K8S_NS} --timeout=5m
  <<: *notify_build_success

# ===============================
# 🛠 Monitor: GitLab Performance & Environment 통합
# ===============================
# 모든 서비스가 배포된 후, 통합 대시보드 활성화를 위한 마지막 잡
monitor-total-status:
  stage: deploy
  image: curlimages/curl
  when: manual        # 👈 'on_success'에서 'manual'로 변경하여 자동 실행을 완전히 차단합니다.
  allow_failure: true # 모니터링은 실패해도 전체 공정에 지장이 없으므로 이건 true가 적절합니다.
  needs: 
    - job: deploy-frontend
      optional: true
    # 백엔드 전체 서비스 개별 참조
    - job: deploy-auth
      optional: true
    - job: deploy-chatbot
      optional: true
    - job: deploy-community
      optional: true
    - job: deploy-mountain
      optional: true
    - job: deploy-notice
      optional: true
    - job: deploy-notification
      optional: true
    - job: deploy-schedule
      optional: true
    - job: deploy-stamp
      optional: true
    - job: deploy-store
      optional: true
    - job: deploy-ai-infra
      optional: true
  environment: # 👈 이 섹션이 있어야 GitLab Environments 메뉴에 대시보드 링크가 생깁니다.
    name: production/total-system
    url: https://hiker-cloud.site
  script:
    - echo "🏁 모든 서비스 배포 상태 확인 및 최종 점검을 시작합니다."
    - echo "대상 도메인:https://hiker-cloud.site"
    - |
      STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://hiker-cloud.site)
      if [ "$STATUS_CODE" -eq 200 ]; then
        echo "✅ 서비스가 정상적으로 응답하고 있습니다. (HTTP 200)"
      else
        echo "⚠️ 서비스 응답 확인 필요. (HTTP $STATUS_CODE)"
      fi
    - echo "GitLab Monitor 메뉴에서 실시간 메트릭을 확인하세요..."
