image: docker:27

services:
  - name: docker:27-dind
    alias: docker
    command: ["--tls=false"]

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  SONAR_HOST_URL: http://43.200.134.128:9000

stages:
  - analyze
  - build
  - deploy

# ===============================
# Slack Notification (공통)
# ===============================
.notify_slack_failure: &notify_slack_failure
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != "success" ]; then
        curl -s -X POST -H "Content-type: application/json" \
          --data "{\"text\":\"❌ CI/CD FAILED | Project=$CI_PROJECT_NAME | Job=$CI_JOB_NAME | Branch=$CI_COMMIT_REF_NAME | Commit=$CI_COMMIT_SHORT_SHA | $CI_PIPELINE_URL\"}" \
          "$SLACK_WEBHOOK_URL"
      fi

# ===============================
# 공통 Build 로직 (Anchor)
# ===============================
.before_build: &before_build |
  apk add --no-cache curl aws-cli git
  docker info

  aws ecr get-login-password --region "$AWS_DEFAULT_REGION" |
  docker login --username AWS --password-stdin \
    "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

  MAJOR_VERSION=2
  LATEST_VERSION=$(aws ecr describe-images \
    --repository-name "$ECR_REPO" \
    --region "$AWS_DEFAULT_REGION" \
    --query 'imageDetails[].imageTags[]' \
    --output text | tr '\t' '\n' \
    | grep "^${MAJOR_VERSION}\.[0-9]\+$" | sort -V | tail -n 1)

  if [ -z "$LATEST_VERSION" ]; then
    NEXT_VERSION="${MAJOR_VERSION}.0"
  else
    NEXT_MINOR=$(echo "$LATEST_VERSION" | awk -F. '{print $2}')
    NEXT_VERSION="${MAJOR_VERSION}.$((NEXT_MINOR + 1))"
  fi

  NEXT_VERSION="$(echo "$NEXT_VERSION" | tr -d '\n')"
  echo "NEXT_VERSION=$NEXT_VERSION" > version.env

# ===============================
# 공통: 변경 감지 유틸 (런타임)
# - rules에서 변수($SERVICE_NAME)로 경로 매칭하지 말고,
#   job 실행 시점에 git diff로 필터링
# ===============================
.detect_changes_backend_service: &detect_changes_backend_service |
  apk add --no-cache git >/dev/null 2>&1 || true

  echo "▶ CI_COMMIT_SHA=$CI_COMMIT_SHA"
  echo "▶ CI_COMMIT_REF_NAME=$CI_COMMIT_REF_NAME"

  # 원격 브랜치 확보 (실패하면 fail)
  git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main --depth=200

  BASE_REF="origin/main"
  echo "▶ BASE_REF=$BASE_REF"
  echo "▶ SERVICE_NAME=$SERVICE_NAME"

  CHANGED_FILES="$(git diff --name-only "$BASE_REF"...HEAD)"
  echo "▶ CHANGED_FILES (top 50):"
  echo "$CHANGED_FILES" | sed -n '1,50p'

  if echo "$CHANGED_FILES" | grep -qE '^services/shared/|^shared/'; then
    echo "✅ shared changed -> build/deploy all services"
    export SHOULD_RUN="1"
  elif echo "$CHANGED_FILES" | grep -qE "^services/backend-services/${SERVICE_NAME}/"; then
    echo "✅ service changed -> ${SERVICE_NAME}"
    export SHOULD_RUN="1"
  else
    echo "⏭ No changes for ${SERVICE_NAME} -> skip"
    export SHOULD_RUN="0"
  fi


#===============================
#ai-infra detect_changes
#===============================

.detect_changes_ai_infra: &detect_changes_ai_infra |
  apk add --no-cache git >/dev/null 2>&1 || true
  git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main --depth=200

  BASE_REF="origin/main"
  CHANGED_FILES="$(git diff --name-only "$BASE_REF"...HEAD)"

  echo "▶ BASE_REF=$BASE_REF"
  echo "▶ CHANGED_FILES (top 50):"
  echo "$CHANGED_FILES" | sed -n '1,50p'

  if echo "$CHANGED_FILES" | grep -qE '^services/backend-services/ai-infra-service/|^services/shared/|^shared/'; then
    export SHOULD_RUN="1"
  else
    export SHOULD_RUN="0"
  fi

# ===============================
# Frontend
# ===============================
sonar-frontend:
  stage: analyze
  needs: []
  image: sonarsource/sonar-scanner-cli:5
  script:
    - |
      sonar-scanner \
        -Dsonar.projectKey=frontend \
        -Dsonar.sources=services/frontend-service \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.qualitygate.wait=true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  <<: *notify_slack_failure

build-frontend:
  stage: build
  variables:
    ECR_REPO: "bravo/hiking-frontend"
  script:
    - *before_build
    - |
      docker build \
        -f services/frontend-service/Dockerfile \
        -t "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${NEXT_VERSION}" \
        services/frontend-service
    - docker push "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${NEXT_VERSION}"
  artifacts:
    reports:
      dotenv: version.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  <<: *notify_slack_failure

deploy-frontend:
  stage: deploy
  variables:
    ECR_REPO: "bravo/hiking-frontend"
  image:
    name: amazon/aws-cli:2.15.0
    entrypoint: [""]
  needs:
    - job: build-frontend
      artifacts: true
      optional: true
  script:
    - curl -LO https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/kubectl

    - |
      aws eks update-kubeconfig \
        --region ap-northeast-2 \
        --name bravo-eks

    - aws sts get-caller-identity
    - kubectl get ns

    - |
      kubectl set image deployment/frontend \
        frontend=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${NEXT_VERSION} \
        -n bravo-front-ns

    - kubectl rollout status deployment/frontend -n bravo-front-ns
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  <<: *notify_slack_failure


# ===============================
# Backend (Multiple Services)
# ===============================

sonar-backend:
  stage: analyze
  image: sonarsource/sonar-scanner-cli:5
  parallel:
    matrix:
      - SERVICE_NAME: ai-service
      - SERVICE_NAME: auth-service
      - SERVICE_NAME: chatbot-service
      - SERVICE_NAME: community-service
      - SERVICE_NAME: mountain-service
      - SERVICE_NAME: notice-service
      - SERVICE_NAME: notification-service
      - SERVICE_NAME: schedule-service
      - SERVICE_NAME: stamp-service
      - SERVICE_NAME: store-service
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - |
      sonar-scanner \
        -Dsonar.projectKey=${SERVICE_NAME} \
        -Dsonar.sources=services/backend-services/${SERVICE_NAME} \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.qualitygate.wait=true
  <<: *notify_slack_failure


build-backend:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  parallel:
    matrix:
      - SERVICE_NAME: ai-service
        ECR_REPO: $AI_ECR_REPO
      - SERVICE_NAME: auth-service
        ECR_REPO: $AUTH_ECR_REPO
      - SERVICE_NAME: chatbot-service
        ECR_REPO: $CHATBOT_ECR_REPO
      - SERVICE_NAME: community-service
        ECR_REPO: $COMMUNITY_ECR_REPO
      - SERVICE_NAME: mountain-service
        ECR_REPO: $MOUNTAIN_ECR_REPO
      - SERVICE_NAME: notice-service
        ECR_REPO: $NOTICE_ECR_REPO
      - SERVICE_NAME: notification-service
        ECR_REPO: $NOTIFICATION_ECR_REPO
      - SERVICE_NAME: schedule-service
        ECR_REPO: $SCHEDULE_ECR_REPO
      - SERVICE_NAME: stamp-service
        ECR_REPO: $STAMP_ECR_REPO
      - SERVICE_NAME: store-service
        ECR_REPO: $STORE_ECR_REPO
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - export IMAGE_TAG="2.${CI_PIPELINE_IID}"
    # 👇 Dockerfile이 기대하는 구조를 CI에서 생성
    - rm -rf backend-services shared
    - mkdir -p backend-services
    - cp -r services/backend-services/${SERVICE_NAME} backend-services/${SERVICE_NAME}

    # shared가 필요한 Dockerfile 대응 (없는 경우 대비)
    - |
      if [ -d services/shared ]; then
        cp -r services/shared ./shared
      else
        mkdir -p shared
      fi
    - apk add --no-cache curl aws-cli
    - docker info
    - |
      aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | \
      docker login --username AWS --password-stdin \
        "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

    - |
      docker build \
        -f services/backend-services/${SERVICE_NAME}/Dockerfile \
        -t "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}" \
        .
    - docker push "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}"
  <<: *notify_slack_failure


deploy-backend:
  stage: deploy
  image:
    name: amazon/aws-cli:2.15.0
    entrypoint: [""]
  parallel:
    matrix:
      # AI 서비스
      - SERVICE_NAME: ai-service
        ECR_REPO: $AI_ECR_REPO
        K8S_NS: bravo-ai-integration-ns

      - SERVICE_NAME: chatbot-service
        ECR_REPO: $CHATBOT_ECR_REPO
        K8S_NS: bravo-ai-integration-ns
        
      # Core backend 서비스
      - SERVICE_NAME: auth-service
        ECR_REPO: $AUTH_ECR_REPO
        K8S_NS: bravo-core-ns
      - SERVICE_NAME: community-service
        ECR_REPO: $COMMUNITY_ECR_REPO
        K8S_NS: bravo-core-ns
      - SERVICE_NAME: mountain-service
        ECR_REPO: $MOUNTAIN_ECR_REPO
        K8S_NS: bravo-core-ns
      - SERVICE_NAME: notice-service
        ECR_REPO: $NOTICE_ECR_REPO
        K8S_NS: bravo-core-ns
      - SERVICE_NAME: notification-service
        ECR_REPO: $NOTIFICATION_ECR_REPO
        K8S_NS: bravo-core-ns
      - SERVICE_NAME: schedule-service
        ECR_REPO: $SCHEDULE_ECR_REPO
        K8S_NS: bravo-core-ns
      - SERVICE_NAME: stamp-service
        ECR_REPO: $STAMP_ECR_REPO
        K8S_NS: bravo-core-ns
      - SERVICE_NAME: store-service
        ECR_REPO: $STORE_ECR_REPO
        K8S_NS: bravo-core-ns
        
  needs:
    - job: build-backend
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - export IMAGE_TAG="2.${CI_PIPELINE_IID}"
    - curl -LO https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/kubectl
    - aws eks update-kubeconfig --region ap-northeast-2 --name bravo-eks
    - |
      if ! aws ecr describe-images \
        --repository-name "${ECR_REPO}" \
        --image-ids imageTag="${IMAGE_TAG}" >/dev/null 2>&1; then
        echo "⏭ Image not found: ${ECR_REPO}:${IMAGE_TAG}"
        exit 0
      fi
    
    - |
      CONTAINER_NAME=$(kubectl get deploy ${SERVICE_NAME} -n ${K8S_NS} \
        -o jsonpath='{.spec.template.spec.containers[0].name}')
      echo "confirmed container: ${CONTAINER_NAME}"
    - |
      kubectl set image deployment/${SERVICE_NAME} \
        ${CONTAINER_NAME}=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG} \
        -n ${K8S_NS}    
    - |
      kubectl rollout status deployment/${SERVICE_NAME} \
        -n ${K8S_NS} \
        --timeout=5m || {
          echo "❌ Rollout failed. Rolling back..."
          kubectl rollout undo deployment/${SERVICE_NAME} -n ${K8S_NS}
          exit 1
        }
  <<: *notify_slack_failure

# ===============================
# AI Infra Service
# ===============================
sonar-ai-infra:
  stage: analyze
  image: sonarsource/sonar-scanner-cli:5
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - |
      sonar-scanner \
        -Dsonar.projectKey=ai-infra-service \
        -Dsonar.sources=services/backend-services/ai-infra-service \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.qualitygate.wait=true
  <<: *notify_slack_failure

build-ai-infra:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    ECR_REPO: "$AI_ECR_REPO"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - export IMAGE_TAG="2.${CI_PIPELINE_IID}"
    - echo "IMAGE_TAG=${IMAGE_TAG}"
    - echo "ECR_REPO=${ECR_REPO}"

    - apk add --no-cache curl aws-cli
    - docker info

    - |
      aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | \
      docker login --username AWS --password-stdin \
        "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
    - |
      docker build \
        -f services/backend-services/ai-infra-service/backend/Dockerfile \
        -t "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}" \
        services/backend-services/ai-infra-service/backend
    - docker push "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}"
  <<: *notify_slack_failure

deploy-ai-infra:
  stage: deploy
  image:
    name: amazon/aws-cli:2.15.0
    entrypoint: [""]
  variables:
    DEPLOYMENT_NAME: "ai-service"
    K8S_NS: "bravo-ai-integration-ns"
    ECR_REPO: "$AI_ECR_REPO"
  needs:
    - job: build-ai-infra
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - export IMAGE_TAG="2.${CI_PIPELINE_IID}"
    - curl -LO https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/kubectl

    - |
      aws eks update-kubeconfig \
        --region ap-northeast-2 \
        --name bravo-eks
    - |
      if ! aws ecr describe-images \
        --repository-name "${ECR_REPO}" \
        --image-ids imageTag="${IMAGE_TAG}" >/dev/null 2>&1; then
        echo "⏭ Image not found: ${ECR_REPO}:${IMAGE_TAG}"
        exit 0
      fi

    - |
      CONTAINER_NAME=$(kubectl get deploy ${DEPLOYMENT_NAME} -n ${K8S_NS} \
        -o jsonpath='{.spec.template.spec.containers[0].name}')
      echo "confirmed container: $CONTAINER_NAME"

    - |
      kubectl set image deployment/${DEPLOYMENT_NAME} \
        ${CONTAINER_NAME}=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG} \
        -n ${K8S_NS}

    - kubectl rollout status deployment/${DEPLOYMENT_NAME} -n ${K8S_NS}
  <<: *notify_slack_failure

