include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml  # 인프라(IaC) 대신 컨테이너 취약점 점검 추천

image: docker:27

services:
  - name: docker:27-dind
    alias: docker
    command: ["--tls=false"]

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  SONAR_HOST_URL: http://43.200.134.128:9000
  # 1. 스캔 제외 대상 정밀화 (백업 파일 및 로그 폴더 제외)
  # .bak 파일과 node_modules(이미 빌드된거라 제외)를 빼서 속도를 높입니다.
  SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, **/node_modules, **/*.bak*, efk, mongodb-replica"

  # 2. Secret Detection 최적화
  # 문서 파일(.md)이나 백업 파일에서 비밀번호를 찾는 불필요한 연산을 줄입니다.
  SECRET_DETECTION_EXCLUDED_PATHS: "**/node_modules, **/*.md, **/*.png"

  # 3. IaC Scanning 깊이 조절
  # backend-services/ai-infra-service/k8s/healthcheck/... 처럼 
  # 깊은 곳의 yaml 파일까지 찾도록 깊이를 10으로 늘립니다.
  SEARCH_MAX_DEPTH: 10

  # 4. 분석기 성능 향상
  # 모노레포 특성상 분석기가 프로젝트 유형을 잘 못 찾을 때를 대비해 강제 지정할 수 있습니다.
  SAST_EXPERIMENTAL_FEATURES: "true"


stages:
  - analyze
  - build
  - test
  - deploy

# ===============================
# Slack Notification (공통)
# ===============================
.notify_slack_failure: &notify_slack_failure
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != "success" ]; then
        curl -s -X POST -H "Content-type: application/json" \
          --data "{\"text\":\"❌ CI/CD FAILED | Project=$CI_PROJECT_NAME | Job=$CI_JOB_NAME | Branch=$CI_COMMIT_REF_NAME | Commit=$CI_COMMIT_SHORT_SHA | $CI_PIPELINE_URL\"}" \
          "$SLACK_WEBHOOK_URL"
      fi

# ===============================
# 공통 Build 로직 (Anchor)
# ===============================
.before_build: &before_build |
  apk add --no-cache curl aws-cli git
  docker info

  aws ecr get-login-password --region "$AWS_DEFAULT_REGION" |
  docker login --username AWS --password-stdin \
    "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

  MAJOR_VERSION=2
  LATEST_VERSION=$(aws ecr describe-images \
    --repository-name "$ECR_REPO" \
    --region "$AWS_DEFAULT_REGION" \
    --query 'imageDetails[].imageTags[]' \
    --output text | tr '\t' '\n' \
    | grep "^${MAJOR_VERSION}\.[0-9]\+$" | sort -V | tail -n 1)

  if [ -z "$LATEST_VERSION" ]; then
    NEXT_VERSION="${MAJOR_VERSION}.0"
  else
    NEXT_MINOR=$(echo "$LATEST_VERSION" | awk -F. '{print $2}')
    NEXT_VERSION="${MAJOR_VERSION}.$((NEXT_MINOR + 1))"
  fi

  NEXT_VERSION="$(echo "$NEXT_VERSION" | tr -d '\n')"
  echo "NEXT_VERSION=$NEXT_VERSION" > version.env

# ==========================================
# 서비스별 변경 감지 규칙 (Rules)
# ==========================================

# 1. Frontend 규칙
.frontend_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "services/frontend-service/**/*"
      when: always
    - when: never

# 2. Backend 규칙
.backend_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "services/backend-services/**/*"
      when: always
    - when: never

# 3. AI Infra 규칙
.ai_infra_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "services/ai-infra/**/*"
      when: always
    - when: never

# ===============================
# Frontend
# ===============================
sonar-frontend:
  stage: analyze
  extends: .frontend_rules
  allow_failure: false  # 품질 검사 실패 시 배포 중단
  needs: []
  image: sonarsource/sonar-scanner-cli:5
  script:
    - |
      sonar-scanner \
        -Dsonar.projectKey=frontend \
        -Dsonar.sources=services/frontend-service \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.qualitygate.wait=true
  <<: *notify_slack_failure

build-frontend:
  stage: build
  extends: .frontend_rules
  allow_failure: false
  variables:
    ECR_REPO: "bravo/hiking-frontend"
  script:
    - *before_build
    - source version.env  # NEXT_VERSION 확보
    - |
      docker build \
        -f services/frontend-service/Dockerfile \
        -t "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${NEXT_VERSION}" \
        services/frontend-service
    - docker push "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${NEXT_VERSION}"
  artifacts:
    reports:
      dotenv: version.env
  <<: *notify_slack_failure

deploy-frontend:
  stage: deploy
  extends: .frontend_rules
  allow_failure: false
  variables:
    ECR_REPO: "bravo/hiking-frontend"
  environment:
    name: production/frontend
    url: https://hiker-cloud.site  # 👈 실제 주소 연결
  image:
    name: amazon/aws-cli:2.15.0
    entrypoint: [""]
  needs:
    - job: build-frontend
      artifacts: true
    - job: sonar-frontend    # 👈 품질 검사 성공 확인 추가
    - job: semgrep-sast
      optional: true         # SAST는 보안 템플릿 상황에 따라 유동적일 수 있어 optional 권장
  script:
    - curl -LO https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/kubectl

    - |
      aws eks update-kubeconfig \
        --region ap-northeast-2 \
        --name bravo-eks

    - source version.env  # 환경변수에서 NEXT_VERSION 로드
    - |
      kubectl set image deployment/frontend \
        frontend=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${NEXT_VERSION} \
        -n bravo-front-ns
    - kubectl rollout status deployment/frontend -n bravo-front-ns
  <<: *notify_slack_failure


# ===============================
# Backend (Multiple Services)
# ===============================

sonar-backend:
  stage: analyze
  extends: .backend_rules
  image: sonarsource/sonar-scanner-cli:5
  # 👈 핵심 1: 소나큐브 스캔이 실패해도 전체 파이프라인은 'Success' 혹은 'Warning'으로 넘어가게 함
  allow_failure: false
  parallel:
    matrix:
      - SERVICE_NAME: ai-service
      - SERVICE_NAME: auth-service
      - SERVICE_NAME: chatbot-service
      - SERVICE_NAME: community-service
      - SERVICE_NAME: mountain-service
      - SERVICE_NAME: notice-service
      - SERVICE_NAME: notification-service
      - SERVICE_NAME: schedule-service
      - SERVICE_NAME: stamp-service
      - SERVICE_NAME: store-service

  script:
    - |
      sonar-scanner \
        -Dsonar.projectKey=${SERVICE_NAME} \
        -Dsonar.sources=services/backend-services/${SERVICE_NAME} \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.qualitygate.wait=true 
  <<: *notify_slack_failure


build-backend:
  stage: build
  extends: .backend_rules
  allow_failure: false
  image: docker:27
  services:
    - docker:27-dind
  parallel:
    matrix:
      - SERVICE_NAME: ai-service
        ECR_REPO: $AI_ECR_REPO
      - SERVICE_NAME: auth-service
        ECR_REPO: $AUTH_ECR_REPO
      - SERVICE_NAME: chatbot-service
        ECR_REPO: $CHATBOT_ECR_REPO
      - SERVICE_NAME: community-service
        ECR_REPO: $COMMUNITY_ECR_REPO
      - SERVICE_NAME: mountain-service
        ECR_REPO: $MOUNTAIN_ECR_REPO
      - SERVICE_NAME: notice-service
        ECR_REPO: $NOTICE_ECR_REPO
      - SERVICE_NAME: notification-service
        ECR_REPO: $NOTIFICATION_ECR_REPO
      - SERVICE_NAME: schedule-service
        ECR_REPO: $SCHEDULE_ECR_REPO
      - SERVICE_NAME: stamp-service
        ECR_REPO: $STAMP_ECR_REPO
      - SERVICE_NAME: store-service
        ECR_REPO: $STORE_ECR_REPO
  script:
    - export IMAGE_TAG="2.${CI_PIPELINE_IID}"
    # 👇 Dockerfile이 기대하는 구조를 CI에서 생성
    - rm -rf backend-services shared
    - mkdir -p backend-services
    - cp -r services/backend-services/${SERVICE_NAME} backend-services/${SERVICE_NAME}

    # shared가 필요한 Dockerfile 대응 (없는 경우 대비)
    - |
      if [ -d services/shared ]; then
        cp -r services/shared ./shared
      else
        mkdir -p shared
      fi
    - apk add --no-cache curl aws-cli
    - docker info
    - |
      aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | \
      docker login --username AWS --password-stdin \
        "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

    - |
      docker build \
        -f services/backend-services/${SERVICE_NAME}/Dockerfile \
        -t "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}" \
        .
    - docker push "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}"
  <<: *notify_slack_failure


deploy-backend:
  stage: deploy
  extends: .backend_rules
  allow_failure: false
  image:
    name: amazon/aws-cli:2.15.0
    entrypoint: [""]
  parallel:
    matrix:
      # AI 서비스
      - SERVICE_NAME: ai-service
        ECR_REPO: $AI_ECR_REPO
        K8S_NS: bravo-ai-integration-ns

      - SERVICE_NAME: chatbot-service
        ECR_REPO: $CHATBOT_ECR_REPO
        K8S_NS: bravo-ai-integration-ns
        
      # Core backend 서비스
      - SERVICE_NAME: auth-service
        ECR_REPO: $AUTH_ECR_REPO
        K8S_NS: bravo-core-ns
      - SERVICE_NAME: community-service
        ECR_REPO: $COMMUNITY_ECR_REPO
        K8S_NS: bravo-core-ns
      - SERVICE_NAME: mountain-service
        ECR_REPO: $MOUNTAIN_ECR_REPO
        K8S_NS: bravo-core-ns
      - SERVICE_NAME: notice-service
        ECR_REPO: $NOTICE_ECR_REPO
        K8S_NS: bravo-core-ns
      - SERVICE_NAME: notification-service
        ECR_REPO: $NOTIFICATION_ECR_REPO
        K8S_NS: bravo-core-ns
      - SERVICE_NAME: schedule-service
        ECR_REPO: $SCHEDULE_ECR_REPO
        K8S_NS: bravo-core-ns
      - SERVICE_NAME: stamp-service
        ECR_REPO: $STAMP_ECR_REPO
        K8S_NS: bravo-core-ns
      - SERVICE_NAME: store-service
        ECR_REPO: $STORE_ECR_REPO
        K8S_NS: bravo-core-ns
        
  needs:
    - job: build-backend
      artifacts: false
    - job: sonar-backend
  script:
    - export IMAGE_TAG="2.${CI_PIPELINE_IID}"
    - curl -LO https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/kubectl
    - aws eks update-kubeconfig --region ap-northeast-2 --name bravo-eks
    - |
      if ! aws ecr describe-images \
        --repository-name "${ECR_REPO}" \
        --image-ids imageTag="${IMAGE_TAG}" >/dev/null 2>&1; then
        echo "⏭ Image not found: ${ECR_REPO}:${IMAGE_TAG}"
        exit 0
      fi
    
    - |
      CONTAINER_NAME=$(kubectl get deploy ${SERVICE_NAME} -n ${K8S_NS} \
        -o jsonpath='{.spec.template.spec.containers[0].name}')
      echo "confirmed container: ${CONTAINER_NAME}"
    - |
      kubectl set image deployment/${SERVICE_NAME} \
        ${CONTAINER_NAME}=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG} \
        -n ${K8S_NS}    
    - |
      kubectl rollout status deployment/${SERVICE_NAME} \
        -n ${K8S_NS} \
        --timeout=5m || {
          echo "❌ Rollout failed. Rolling back..."
          kubectl rollout undo deployment/${SERVICE_NAME} -n ${K8S_NS}
          exit 1
        }
  <<: *notify_slack_failure

# ===============================
# AI Infra Service
# ===============================
sonar-ai-infra:
  stage: analyze
  extends: .ai_infra_rules
  allow_failure: false
  image: sonarsource/sonar-scanner-cli:5
  script:
    - |
      sonar-scanner \
        -Dsonar.projectKey=ai-infra-service \
        -Dsonar.sources=services/backend-services/ai-infra-service \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.qualitygate.wait=true
  <<: *notify_slack_failure

build-ai-infra:
  stage: build
  extends: .ai_infra_rules
  allow_failure: false
  variables:
    ECR_REPO: "$AI_ECR_REPO"
  script:
    - export IMAGE_TAG="2.${CI_PIPELINE_IID}"
    - echo "IMAGE_TAG=${IMAGE_TAG}"
    - echo "ECR_REPO=${ECR_REPO}"

    - apk add --no-cache curl aws-cli
    - docker info

    - |
      aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | \
      docker login --username AWS --password-stdin \
        "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
    - |
      docker build \
        -f services/backend-services/ai-infra-service/backend/Dockerfile \
        -t "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}" \
        services/backend-services/ai-infra-service/backend
    - docker push "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}"
  <<: *notify_slack_failure

deploy-ai-infra:
  stage: deploy
  extends: .ai_infra_rules
  allow_failure: false
  image:
    name: amazon/aws-cli:2.15.0
    entrypoint: [""]
  variables:
    DEPLOYMENT_NAME: "ai-service"
    K8S_NS: "bravo-ai-integration-ns"
    ECR_REPO: "$AI_ECR_REPO"
  needs:
    - job: build-ai-infra
      artifacts: true
      optional: true  # 👈 추가: 빌드 잡이 없어도 에러 내지 않음
    - job: sonar-ai-infra
      optional: true  # 👈 추가: 분석 잡이 없어도 에러 내지 않음
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - export IMAGE_TAG="2.${CI_PIPELINE_IID}"
    - curl -LO https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/kubectl

    - |
      aws eks update-kubeconfig \
        --region ap-northeast-2 \
        --name bravo-eks
    - |
      if ! aws ecr describe-images \
        --repository-name "${ECR_REPO}" \
        --image-ids imageTag="${IMAGE_TAG}" >/dev/null 2>&1; then
        echo "⏭ Image not found: ${ECR_REPO}:${IMAGE_TAG}"
        exit 0
      fi

    - |
      CONTAINER_NAME=$(kubectl get deploy ${DEPLOYMENT_NAME} -n ${K8S_NS} \
        -o jsonpath='{.spec.template.spec.containers[0].name}')
      echo "confirmed container: $CONTAINER_NAME"

    - |
      kubectl set image deployment/${DEPLOYMENT_NAME} \
        ${CONTAINER_NAME}=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG} \
        -n ${K8S_NS}

    - |
      kubectl rollout status deployment/${DEPLOYMENT_NAME} \
        -n ${K8S_NS} \
        --timeout=5m || {
          echo "❌ Rollout failed. Rolling back..."
          kubectl rollout undo deployment/${DEPLOYMENT_NAME} -n ${K8S_NS}
          exit 1
        }
  <<: *notify_slack_failure

# ===============================
# 🛠 Monitor: GitLab Performance & Environment 통합
# ===============================
# 모든 서비스가 배포된 후, 통합 대시보드 활성화를 위한 마지막 잡
monitor-total-status:
  stage: deploy
  image: curlimages/curl
  when: always  # 👈 앞 단계 성공/실패 여부 상관없이 무조건 실행
  needs: 
    - job: deploy-frontend
      optional: true
    - job: deploy-backend
      optional: true
    - job: deploy-ai-infra
      optional: true
  environment: # 👈 이 섹션이 있어야 GitLab Environments 메뉴에 대시보드 링크가 생깁니다.
    name: production/total-system
    url: https://hiker-cloud.site
  script:
    - echo "🏁 파이프라인 완주 시도. 서비스 상태를 최종 점검합니다."
    - curl -s -I https://hiker-cloud.site | grep "HTTP/" || echo "사이트 응답 불가"
    - echo "GitLab Monitor 메뉴에서 실시간 메트릭을 확인하세요."
