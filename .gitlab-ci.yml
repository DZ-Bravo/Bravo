image: docker:27

services:
  - name: docker:27-dind
    alias: docker
    command: ["--tls=false"]

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  SONAR_HOST_URL: http://43.200.134.128:9000

stages:
  - analyze
  - build
  - deploy

# ===============================
# Slack Notification (공통)
# ===============================
.notify_slack_failure: &notify_slack_failure
  script:
    - "true"
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != "success" ]; then
        curl -s -X POST -H "Content-type: application/json" \
          --data "{\"text\":\"❌ CI/CD FAILED | Project=$CI_PROJECT_NAME | Job=$CI_JOB_NAME | Branch=$CI_COMMIT_REF_NAME | Commit=$CI_COMMIT_SHORT_SHA | $CI_PIPELINE_URL\"}" \
          "$SLACK_WEBHOOK_URL"
      fi

# ===============================
# 공통 Build 로직 (Anchor)
# - 버전 계산 제거 (ECR 조회 기반 NEXT_VERSION 제거)
# - 로그인/환경 준비만 수행
# ===============================
.before_build: &before_build |
  apk add --no-cache curl aws-cli
  docker info

  aws ecr get-login-password --region "$AWS_DEFAULT_REGION" |
  docker login --username AWS --password-stdin \
    "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

# ===============================
# Frontend
# ===============================
sonar-frontend:
  stage: analyze
  needs: []
  image: sonarsource/sonar-scanner-cli:5
  script:
    - |
      sonar-scanner \
        -Dsonar.projectKey=frontend \
        -Dsonar.sources=services/frontend-service \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.qualitygate.wait=true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/frontend-service/**/*
  <<: *notify_slack_failure

build-frontend:
  stage: build
  variables:
    ECR_REPO: "bravo/hiking-frontend"
  script:
    - *before_build
    - VERSION="2.${CI_PIPELINE_IID}"
    - echo "SERVICE=frontend"
    - echo "VERSION=${VERSION}"
    - echo "ECR_REPO=${ECR_REPO}"
    - |
      docker build \
        -f services/frontend-service/Dockerfile \
        -t "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${VERSION}" \
        services/frontend-service
    - docker push "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${VERSION}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/frontend-service/**/*
  <<: *notify_slack_failure

deploy-frontend:
  stage: deploy
  variables:
    ECR_REPO: "bravo/hiking-frontend"
  image:
    name: amazon/aws-cli:2.15.0
    entrypoint: [""]
  needs:
    - job: build-frontend
  script:
    # kubectl 설치 (EKS 1.34)
    - curl -LO https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/kubectl

    # EKS kubeconfig
    - |
      aws eks update-kubeconfig \
        --region ap-northeast-2 \
        --name bravo-eks

    # 검증
    - aws sts get-caller-identity
    - kubectl get ns

    # 동일 파이프라인 버전 사용
    - VERSION="2.${CI_PIPELINE_IID}"
    - echo "SERVICE=frontend"
    - echo "VERSION=${VERSION}"
    - echo "ECR_REPO=${ECR_REPO}"

    # (선택) 이미지 존재 확인
    - |
      echo "▶ Checking image ${ECR_REPO}:${VERSION}"
      aws ecr describe-images \
        --repository-name "${ECR_REPO}" \
        --image-ids imageTag="${VERSION}" >/dev/null 2>&1

    # 배포
    - |
      kubectl set image deployment/frontend \
        frontend=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${VERSION} \
        -n bravo-front-ns

    # 롤아웃 확인
    - kubectl rollout status deployment/frontend -n bravo-front-ns --timeout=120s
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/frontend-service/**/*
  <<: *notify_slack_failure

# ===============================
# Backend (Multiple Services)
# ===============================
sonar-backend:
  stage: analyze
  needs: []
  image: sonarsource/sonar-scanner-cli:5
  parallel:
    matrix:
      - SERVICE_NAME: ai-service
      - SERVICE_NAME: auth-service
      - SERVICE_NAME: chatbot-service
      - SERVICE_NAME: community-service
      - SERVICE_NAME: mountain-service
      - SERVICE_NAME: notice-service
      - SERVICE_NAME: notification-service
      - SERVICE_NAME: schedule-service
      - SERVICE_NAME: stamp-service
      - SERVICE_NAME: store-service
  script:
    - |
      sonar-scanner \
        -Dsonar.projectKey=${SERVICE_NAME} \
        -Dsonar.sources=services/backend-services/${SERVICE_NAME} \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.qualitygate.wait=true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/backend-services/${SERVICE_NAME}/**/*
        - shared/**/*
  <<: *notify_slack_failure

build-backend:
  stage: build
  parallel:
    matrix:
      - SERVICE_NAME: ai-service
        ECR_REPO: $AI_ECR_REPO
      - SERVICE_NAME: auth-service
        ECR_REPO: $AUTH_ECR_REPO
      - SERVICE_NAME: chatbot-service
        ECR_REPO: $CHATBOT_ECR_REPO
      - SERVICE_NAME: community-service
        ECR_REPO: $COMMUNITY_ECR_REPO
      - SERVICE_NAME: mountain-service
        ECR_REPO: $MOUNTAIN_ECR_REPO
      - SERVICE_NAME: notice-service
        ECR_REPO: $NOTICE_ECR_REPO
      - SERVICE_NAME: notification-service
        ECR_REPO: $NOTIFICATION_ECR_REPO
      - SERVICE_NAME: schedule-service
        ECR_REPO: $SCHEDULE_ECR_REPO
      - SERVICE_NAME: stamp-service
        ECR_REPO: $STAMP_ECR_REPO
      - SERVICE_NAME: store-service
        ECR_REPO: $STORE_ECR_REPO
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/backend-services/$SERVICE_NAME/**/*
        - shared/**/*
  script:
    - *before_build
    - VERSION="2.${CI_PIPELINE_IID}"
    - echo "SERVICE=${SERVICE_NAME}"
    - echo "VERSION=${VERSION}"
    - echo "ECR_REPO=${ECR_REPO}"
    - |
      docker build \
        -f services/backend-services/${SERVICE_NAME}/Dockerfile \
        -t "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${VERSION}" \
        services/backend-services/${SERVICE_NAME}
    - docker push "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${VERSION}"
  <<: *notify_slack_failure

deploy-backend:
  stage: deploy
  image:
    name: amazon/aws-cli:2.15.0
    entrypoint: [""]
  parallel:
    matrix:
      - SERVICE_NAME: ai-service
        ECR_REPO: $AI_ECR_REPO
      - SERVICE_NAME: auth-service
        ECR_REPO: $AUTH_ECR_REPO
      - SERVICE_NAME: chatbot-service
        ECR_REPO: $CHATBOT_ECR_REPO
      - SERVICE_NAME: community-service
        ECR_REPO: $COMMUNITY_ECR_REPO
      - SERVICE_NAME: mountain-service
        ECR_REPO: $MOUNTAIN_ECR_REPO
      - SERVICE_NAME: notice-service
        ECR_REPO: $NOTICE_ECR_REPO
      - SERVICE_NAME: notification-service
        ECR_REPO: $NOTIFICATION_ECR_REPO
      - SERVICE_NAME: schedule-service
        ECR_REPO: $SCHEDULE_ECR_REPO
      - SERVICE_NAME: stamp-service
        ECR_REPO: $STAMP_ECR_REPO
      - SERVICE_NAME: store-service
        ECR_REPO: $STORE_ECR_REPO
  needs:
    - job: build-backend
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/backend-services/$SERVICE_NAME/**/*
        - shared/**/*
  script:
    # kubectl 설치
    - curl -LO https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/kubectl

    # EKS 인증
    - aws eks update-kubeconfig --region ap-northeast-2 --name bravo-eks

    # 동일 파이프라인 버전 사용
    - VERSION="2.${CI_PIPELINE_IID}"
    - echo "SERVICE=${SERVICE_NAME}"
    - echo "VERSION=${VERSION}"
    - echo "ECR_REPO=${ECR_REPO}"

    # 이미지 존재 확인 (없으면 해당 서비스 배포 스킵)
    - |
      echo "▶ Checking image ${ECR_REPO}:${VERSION}"
      if ! aws ecr describe-images \
        --repository-name "${ECR_REPO}" \
        --image-ids imageTag="${VERSION}" >/dev/null 2>&1; then
        echo "⏭ No new image for ${SERVICE_NAME}, skipping deploy"
        exit 0
      fi

    # 배포
    - |
      kubectl set image deployment/${SERVICE_NAME} \
        ${SERVICE_NAME}=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${VERSION} \
        -n bravo-core-ns

    # 상태 확인
    - kubectl rollout status deployment/${SERVICE_NAME} -n bravo-core-ns --timeout=120s
  <<: *notify_slack_failure

# ===============================
# AI Infra Service
# ===============================
sonar-ai-infra:
  stage: analyze
  needs: []
  image: sonarsource/sonar-scanner-cli:5
  script:
    - |
      sonar-scanner \
        -Dsonar.projectKey=ai-infra-service \
        -Dsonar.sources=services/backend-services/ai-infra-service \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN \
        -Dsonar.qualitygate.wait=true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/backend-services/ai-infra-service/**/*
  <<: *notify_slack_failure

build-ai-infra:
  stage: build
  variables:
    ECR_REPO: "$AI_ECR_REPO"
  script:
    - *before_build
    - VERSION="2.${CI_PIPELINE_IID}"
    - echo "SERVICE=ai-infra-service"
    - echo "VERSION=${VERSION}"
    - echo "ECR_REPO=${ECR_REPO}"
    - |
      docker build \
        -f services/backend-services/ai-infra-service/backend/Dockerfile \
        -t "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${VERSION}" \
        services/backend-services/ai-infra-service/backend
    - docker push "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${VERSION}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/backend-services/ai-infra-service/**/*
  <<: *notify_slack_failure

deploy-ai-infra:
  stage: deploy
  image:
    name: amazon/aws-cli:2.15.0
    entrypoint: [""]
  variables:
    DEPLOYMENT_NAME: "ai-service"
    K8S_NS: "bravo-ai-integration-ns"
    ECR_REPO: "$AI_ECR_REPO"
  needs:
    - job: build-ai-infra
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/backend-services/ai-infra-service/**/*
  script:
    # kubectl 설치
    - curl -LO https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/kubectl

    # EKS 인증
    - |
      aws eks update-kubeconfig \
        --region ap-northeast-2 \
        --name bravo-eks

    # 동일 파이프라인 버전 사용
    - VERSION="2.${CI_PIPELINE_IID}"
    - echo "DEPLOYMENT_NAME=${DEPLOYMENT_NAME}"
    - echo "K8S_NS=${K8S_NS}"
    - echo "VERSION=${VERSION}"
    - echo "ECR_REPO=${ECR_REPO}"

    # 컨테이너 이름 자동 추출
    - |
      CONTAINER_NAME=$(kubectl get deploy ${DEPLOYMENT_NAME} -n ${K8S_NS} \
        -o jsonpath='{.spec.template.spec.containers[0].name}')
      echo confirmed container: $CONTAINER_NAME

    # 이미지 존재 확인 (없으면 배포 중단)
    - |
      echo "▶ Checking image ${ECR_REPO}:${VERSION}"
      aws ecr describe-images \
        --repository-name "${ECR_REPO}" \
        --image-ids imageTag="${VERSION}" >/dev/null 2>&1

    # 이미지 교체
    - |
      kubectl set image deployment/${DEPLOYMENT_NAME} \
        ${CONTAINER_NAME}=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}:${VERSION} \
        -n ${K8S_NS}

    # 롤아웃 확인
    - kubectl rollout status deployment/${DEPLOYMENT_NAME} -n ${K8S_NS} --timeout=120s
  <<: *notify_slack_failure

