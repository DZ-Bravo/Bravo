include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

image: docker:27

services:
  - name: docker:27-dind
    alias: docker
    command: ["--tls=false"]

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  SONAR_HOST_URL: http://43.200.134.128:9000
  SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, **/node_modules, **/*.bak*, efk, mongodb-replica"
  SECRET_DETECTION_EXCLUDED_PATHS: "**/node_modules, **/*.md, **/*.png"
  SEARCH_MAX_DEPTH: 10
  SAST_EXPERIMENTAL_FEATURES: "true"

stages:
  - analyze
  - build
  - test
  - deploy

# ===============================
# Slack Notification (공통)
# ===============================
.notify_slack_failure: &notify_slack_failure
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != "success" ]; then
        curl -s -X POST -H "Content-type: application/json" \
          --data "{\"text\":\"❌ CI/CD FAILED | Project=$CI_PROJECT_NAME | Job=$CI_JOB_NAME | Branch=$CI_COMMIT_REF_NAME | Commit=$CI_COMMIT_SHORT_SHA | $CI_PIPELINE_URL\"}" \
          "$SLACK_WEBHOOK_URL"
      fi

.notify_build_success: &notify_build_success
  after_script:
    - |
      if [ "$CI_JOB_STATUS" == "success" ]; then
        curl -s -X POST -H "Content-type: application/json" \
          --data "{\"text\":\"✅ BUILD SUCCESS | Service=$SERVICE_NAME | Version=$NEXT_VERSION | $CI_PROJECT_NAME 가 성공적으로 빌드되어 배포 준비가 완료되었습니다! 🚀\"}" \
          "$SLACK_WEBHOOK_URL"
      else
        curl -s -X POST -H "Content-type: application/json" \
          --data "{\"text\":\"❌ CI/CD FAILED | Project=$CI_PROJECT_NAME | Job=$CI_JOB_NAME | Branch=$CI_COMMIT_REF_NAME | Commit=$CI_COMMIT_SHORT_SHA | $CI_PIPELINE_URL\"}" \
          "$SLACK_WEBHOOK_URL"
      fi

# ===============================
# 공통 Build 로직 (Anchor)
# ===============================
.before_build: &before_build |
  apk add --no-cache curl aws-cli git
  docker info
  aws ecr get-login-password --region "$AWS_DEFAULT_REGION" |
  docker login --username AWS --password-stdin \
    "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
  MAJOR_VERSION=2
  LATEST_VERSION=$(aws ecr describe-images \
    --repository-name "$ECR_REPO" \
    --region "$AWS_DEFAULT_REGION" \
    --query 'imageDetails[].imageTags[]' \
    --output text | tr '\t' '\n' \
    | grep "^${MAJOR_VERSION}\.[0-9]\+$" | sort -V | tail -n 1)
  if [ -z "$LATEST_VERSION" ]; then
    NEXT_VERSION="${MAJOR_VERSION}.0"
  else
    NEXT_MINOR=$(echo "$LATEST_VERSION" | awk -F. '{print $2}')
    NEXT_VERSION="${MAJOR_VERSION}.$((NEXT_MINOR + 1))"
  fi
  NEXT_VERSION="$(echo "$NEXT_VERSION" | tr -d '\n')"
  echo "NEXT_VERSION=$NEXT_VERSION" > version.env

# ==========================================
# 서비스별 변경 감지 규칙 (Rules)
# ==========================================

# 1. Frontend Rules
.frontend_rules_auto:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: ["services/frontend-service/**/*"]
      when: always
    - when: never

.frontend_rules_manual:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: ["services/frontend-service/**/*"]
      when: manual
    - when: never

# 2. AI Infra Rules
.ai_infra_rules_auto:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: ["services/ai-infra/**/*"]
      when: always
    - when: never

.ai_infra_rules_manual:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: ["services/ai-infra/**/*"]
      when: manual
    - when: never

# 3. Backend Rules (백엔드 공통 분석용)
.backend_rules_auto:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: ["services/backend-services/**/*"]
      when: always
    - when: never

# 4. Backend 개별 서비스 규칙들
.rule_auth_auto:
