# =================================================
# Healthcheck Script ConfigMap
# =================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: healthcheck-script
  namespace: bravo-ai-integration-ns
data:
  healthcheck.sh: |
    #!/bin/sh
    
    # 헬스체크 스크립트
    # 30초마다 실행되며, HTTP 헬스체크, 마운트 체크를 수행합니다.
    
    ERROR_LOG="/tmp/healthcheck-errors.log"
    ERROR_STATE_FILE="/tmp/healthcheck-error-state.log"
    SLACK_WEBHOOK_URL="${SLACK_WEBHOOK_URL:-}"
    ALERT_COOLDOWN=300  # 5분 (300초) - 같은 에러는 5분에 한 번만 알림
    
    # 로그 함수
    log_error() {
      local error_msg="[$(date +'%Y-%m-%d %H:%M:%S')] ERROR: $1"
      echo "$error_msg" >> "$ERROR_LOG"
      echo "$error_msg" >&2  # stderr로 출력 (Pod 로그에서 읽을 수 있도록)
    }
    
    # Slack 알람 전송 (중복 알림 방지 포함)
    send_slack_alert() {
      if [ -z "$SLACK_WEBHOOK_URL" ]; then
        return
      fi
      
      local message="$1"
      local current_time=$(date +%s)
      local error_key=$(echo "$message" | md5sum | cut -d' ' -f1)
      local last_alert_time=0
      
      # 마지막 알림 시간 확인
      if [ -f "$ERROR_STATE_FILE" ]; then
        last_alert_time=$(grep "^$error_key:" "$ERROR_STATE_FILE" 2>/dev/null | cut -d: -f2 || echo "0")
      fi
      
      # 쿨다운 시간 체크
      local time_since_last=$((current_time - last_alert_time))
      if [ $time_since_last -lt $ALERT_COOLDOWN ]; then
        echo "알림 쿨다운 중: ${time_since_last}초 전에 알림 전송됨 (${ALERT_COOLDOWN}초 대기 필요)"
        return
      fi
      
      # 알림 전송
      local payload=$(cat <<EOF
    {
      "attachments": [{
        "color": "danger",
        "title": "헬스체크 실패",
        "text": "$message",
        "footer": "HIKER 인프라 모니터링",
        "ts": $current_time
      }]
    }
    EOF
    )
      
      curl -X POST -H 'Content-type: application/json' \
        --data "$payload" \
        "$SLACK_WEBHOOK_URL" > /dev/null 2>&1
      
      # 알림 시간 기록
      if [ -f "$ERROR_STATE_FILE" ]; then
        # 기존 항목 제거
        grep -v "^$error_key:" "$ERROR_STATE_FILE" > "${ERROR_STATE_FILE}.tmp" 2>/dev/null || true
        mv "${ERROR_STATE_FILE}.tmp" "$ERROR_STATE_FILE" 2>/dev/null || touch "$ERROR_STATE_FILE"
      fi
      echo "$error_key:$current_time" >> "$ERROR_STATE_FILE"
      
      # 오래된 항목 정리 (쿨다운 시간의 2배 이상 된 항목 제거)
      local cutoff_time=$((current_time - ALERT_COOLDOWN * 2))
      if [ -f "$ERROR_STATE_FILE" ]; then
        awk -F: -v cutoff="$cutoff_time" '$2 > cutoff || $2 == ""' "$ERROR_STATE_FILE" > "${ERROR_STATE_FILE}.tmp" 2>/dev/null
        mv "${ERROR_STATE_FILE}.tmp" "$ERROR_STATE_FILE" 2>/dev/null || touch "$ERROR_STATE_FILE"
      fi
    }
    
    # HTTP 헬스체크 함수
    check_http_health() {
      local service_url=$1
      local service_name=$2
      
      if ! curl -f -s -m 5 "$service_url/health" > /dev/null 2>&1; then
        local error_msg="HTTP 헬스체크 실패: $service_name ($service_url/health)"
        log_error "$error_msg"
        send_slack_alert "$error_msg"
        return 1
      fi
      return 0
    }
    
    # 마운트 체크
    check_mounts() {
      df -h | grep -E "^/dev/" | while read -r line; do
        usage=$(echo "$line" | awk '{print $5}' | sed 's/%//')
        mount_point=$(echo "$line" | awk '{print $6}')
        
        if [ "$usage" -gt 85 ]; then
          local error_msg="디스크 사용률 경고: $mount_point - ${usage}% (임계치: 85%)"
          log_error "$error_msg"
          send_slack_alert "$error_msg"
        fi
      done
    }
    
    # Kubernetes 서비스 HTTP 헬스체크
    check_k8s_services() {
      # 주요 서비스 HTTP 헬스체크
      check_http_health "http://auth-service.bravo-core-ns.svc.cluster.local:3001" "auth-service"
      check_http_health "http://community-service.bravo-core-ns.svc.cluster.local:3002" "community-service"
      check_http_health "http://ai-infra-service.bravo-ai-integration-ns.svc.cluster.local:80" "ai-infra-service"
      # 추가 서비스 헬스체크...
    }
    
    # 메인 실행
    main() {
      # Kubernetes 서비스 HTTP 헬스체크
      check_k8s_services
      
      # 마운트 체크
      check_mounts
    }
    
    # 스크립트 실행
    main

---
# =================================================
# Healthcheck DaemonSet
# =================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: healthcheck
  namespace: bravo-ai-integration-ns
spec:
  selector:
    matchLabels:
      app: healthcheck
  template:
    metadata:
      labels:
        app: healthcheck
    spec:
      hostNetwork: false  # Kubernetes DNS 사용을 위해 false로 변경
      dnsPolicy: ClusterFirst
      containers:
      - name: healthcheck
        image: alpine/curl:latest
        command:
        - /bin/sh
        - -c
        - |
          while true; do
            /scripts/healthcheck.sh
            sleep 30
          done
        env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: ai-infra-secrets
              key: SLACK_WEBHOOK_URL
        volumeMounts:
        - name: healthcheck-script
          mountPath: /scripts
      volumes:
      - name: healthcheck-script
        configMap:
          name: healthcheck-script
          defaultMode: 0755

